<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EagleTracker</title>
<meta name="theme-color" content="#060a11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* EagleTracker 3.0 - built for EagleReversion V2.0.
   Deep navy ground, mint-teal accent, gold for the brand mark, green/red only for money. */
:root {
  color-scheme: dark;
  --bg: #060a11; --bg-2: #09101a; --surface: #0d141f; --surface-2: #131c2a; --surface-3: #1a2536;
  --line: #1f2b3d; --line-2: #2a3a52;
  --fg: #edf2f8; --fg-2: #c3cedb; --muted: #8191a7;
  --accent: #1fd1ad; --accent-2: #0fa88a; --accent-ink: #032a22; --accent-soft: rgba(31, 209, 173, .13);
  --blue: #4ea4ff; --gold: #f6b93b; --pos: #2fe39a; --neg: #ff5470;
  --pos-soft: rgba(47, 227, 154, .13); --neg-soft: rgba(255, 84, 112, .13); --gold-soft: rgba(246, 185, 59, .14); --blue-soft: rgba(78, 164, 255, .14);
  /* names kept for the news module */
  --brass: var(--accent); --brass-ink: var(--accent-ink); --hot: var(--neg); --cool: var(--blue);
  --f-display: "Plus Jakarta Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-sans: "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 18px; --r-sm: 12px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); margin: 0; }
body { font-family: var(--f-sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(1200px 500px at 85% -10%, rgba(31, 209, 173, .07), transparent 60%), var(--bg); background-attachment: fixed; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -.015em; line-height: 1.15; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; } h3 { font-size: 17px; }
p { margin: 0; text-wrap: pretty; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }
.pos, .up { color: var(--pos); } .neg, .down { color: var(--neg); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1120px; margin: 0 auto; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }

/* ---------- app bar ---------- */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: rgba(6, 10, 17, .86); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.appbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(140deg, #0e5c54, #07182a); color: var(--gold); display: grid; place-items: center; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
.brand { display: grid; line-height: 1.1; min-width: 0; }
.brand .name { font-family: var(--f-display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; }
.brand .sub { font-size: 11.5px; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.sp { flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; }
.sync:empty { display: none; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.live i { background: var(--pos); box-shadow: 0 0 0 3px var(--pos-soft); animation: pulse 2s ease-in-out infinite; }
.sync.stale i { background: var(--neg); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(47, 227, 154, 0); } }
.iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; width: 40px; height: 40px; display: grid; place-items: center; color: var(--fg); flex: none; }
.iconbtn svg { width: 20px; height: 20px; }

/* ---------- bottom navigation ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(9, 14, 22, .94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px max(6px, env(safe-area-inset-right, 0px)) 6px max(6px, env(safe-area-inset-left, 0px)); }
.navbtn { background: none; border: 0; padding: 6px 2px; display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; border-radius: 12px; }
.navbtn svg { width: 22px; height: 22px; }
.navbtn .pip { width: 46px; height: 28px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.navbtn[aria-current="page"] { color: var(--fg); }
.navbtn[aria-current="page"] .pip { background: var(--accent-soft); color: var(--accent); }

/* ---------- sections and cards ---------- */
.sec { display: grid; gap: 14px; padding-block: 16px 28px; }
.sec > * { min-width: 0; }
@media (min-width: 900px) { .sec.two { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } .sec.two .full { grid-column: 1 / -1; } }
.card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flat { background: var(--surface); }
.card > h3 + * { margin-top: 10px; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cardhead .ttl { display: flex; align-items: center; gap: 10px; }
.cardhead .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.cardhead .ic svg { width: 17px; height: 17px; }
.sechead { display: flex; align-items: end; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sechead h2 { font-size: 26px; }

/* hero */
.hero { position: relative; overflow: hidden; border-radius: 24px; padding: 18px; display: grid; gap: 16px; border: 1px solid rgba(31, 209, 173, .28);
  background: radial-gradient(420px 220px at 100% 0%, rgba(31, 209, 173, .28), transparent 70%), radial-gradient(380px 260px at 0% 100%, rgba(78, 164, 255, .18), transparent 70%), linear-gradient(150deg, #0c3a37 0%, #0a1f33 70%, #08131f 100%);
  box-shadow: 0 24px 50px -30px rgba(31, 209, 173, .55); }
.hero .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hero .label-sm { font-size: 12px; color: rgba(237, 242, 248, .72); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.hero .big { font-family: var(--f-display); font-weight: 800; font-size: clamp(36px, 10vw, 50px); line-height: 1; letter-spacing: -.03em; margin-top: 6px; }
.hero .delta { margin-top: 8px; display: inline-flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; }
.hero .trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hero .trio > div { background: rgba(3, 8, 14, .38); border: 1px solid rgba(255, 255, 255, .06); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.hero .trio .v { font-family: var(--f-display); font-weight: 700; font-size: 17px; overflow-wrap: anywhere; margin-top: 2px; }
.hero .trio .eyebrow { color: rgba(237, 242, 248, .62); font-size: 10.5px; }
.hero .acct { font-size: 12.5px; color: rgba(237, 242, 248, .7); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
@media (max-width: 380px) { .hero .trio { grid-template-columns: 1fr 1fr; } }

/* pills, badges, chips */
.pill { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; border: 1px solid transparent; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--pos-soft); color: var(--pos); border-color: rgba(47, 227, 154, .3); }
.pill.bad { background: var(--neg-soft); color: var(--neg); border-color: rgba(255, 84, 112, .3); }
.pill.warn { background: var(--gold-soft); color: var(--gold); border-color: rgba(246, 185, 59, .3); }
.pill.info { background: var(--blue-soft); color: var(--blue); border-color: rgba(78, 164, 255, .3); }
.pill.dim { background: var(--surface-3); color: var(--muted); }
.clockrow .pill, .newsbar .pill { text-transform: none; letter-spacing: 0; font-weight: 500; background: var(--surface); border-color: var(--line); color: var(--fg); padding: 5px 12px; font-size: 13px; }
.pill b { font-weight: 700; }
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 3px 8px; border-radius: 7px; background: var(--surface-3); color: var(--muted); }
.badge.ready { background: var(--accent-soft); color: var(--accent); }
.badge.demo { background: var(--gold-soft); color: var(--gold); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 13px; text-align: left; white-space: nowrap; flex: none; color: var(--fg-2); font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.chip small { display: block; font-size: 11px; opacity: .75; font-variant-numeric: tabular-nums; }
.chip.gold:not([aria-pressed="true"]) { border-color: rgba(246, 185, 59, .45); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { background: none; border: 0; padding: 6px 12px; font-size: 13px; color: var(--muted); border-radius: 9px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-2); }

/* KPI tiles */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; min-width: 0; position: relative; overflow: hidden; }
.tile::after { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--tone, var(--line-2)); }
.tile.t-pos { --tone: var(--pos); } .tile.t-neg { --tone: var(--neg); } .tile.t-acc { --tone: var(--accent); } .tile.t-gold { --tone: var(--gold); } .tile.t-blue { --tone: var(--blue); }
.tile .v { font-family: var(--f-display); font-weight: 700; font-size: 21px; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ringrow { display: flex; align-items: center; gap: 14px; }
.ring { flex: none; }

/* charts */
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* bars list */
.bars { display: grid; gap: 12px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; align-items: baseline; }
.bar .k { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.bar .k small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.bar .track { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; position: relative; }
.bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
.bar .fill.p { background: linear-gradient(90deg, var(--accent-2), var(--pos)); }
.bar .fill.n { background: linear-gradient(90deg, #c2304a, var(--neg)); }
.bar .fill.a { background: linear-gradient(90deg, #2c74c9, var(--blue)); }

/* tables */
table { border-collapse: collapse; width: 100%; }
.tbl { overflow-x: auto; }
th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }

/* trade + position rows */
.list { display: grid; }
.trow { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.trow:last-child { border-bottom: 0; }
.trow .av { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 12px; font-family: var(--f-display); }
.trow .av.buy { background: var(--pos-soft); color: var(--pos); }
.trow .av.sell { background: var(--neg-soft); color: var(--neg); }
.trow .t1 { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.trow .t2 { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.trow .rt { text-align: right; white-space: nowrap; }
.trow .rt b { font-family: var(--f-display); font-size: 16px; }
.why { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--fg-2); }
.why.tp { background: var(--pos-soft); color: var(--pos); } .why.sl { background: var(--neg-soft); color: var(--neg); }
.why.news { background: var(--gold-soft); color: var(--gold); } .why.time { background: var(--blue-soft); color: var(--blue); }
.poscard { border: 1px solid var(--line); background: var(--bg-2); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
.slbar { position: relative; height: 8px; border-radius: 99px; background: linear-gradient(90deg, rgba(255, 84, 112, .55), var(--surface-3) 45%, var(--surface-3) 55%, rgba(47, 227, 154, .55)); }
.slbar .dot { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: var(--fg); border: 3px solid var(--bg); transform: translate(-50%, -50%); box-shadow: 0 0 0 1px var(--line-2); }
.slbar .ent { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
.slrow { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

/* news shield */
.shield { display: grid; gap: 10px; }
.evt { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.evt:last-child { border-bottom: 0; }
.evt .d { text-align: center; background: var(--surface-3); border-radius: 10px; padding: 5px 0; font-size: 11px; color: var(--muted); line-height: 1.2; }
.evt .d b { display: block; font-size: 15px; color: var(--fg); font-family: var(--f-display); }
.evt .n { font-weight: 600; overflow-wrap: anywhere; }
.banner { border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
.banner.bad { background: var(--neg-soft); border: 1px solid rgba(255, 84, 112, .35); }
.banner.ok { background: var(--accent-soft); border: 1px solid rgba(31, 209, 173, .3); }
.banner.warn { background: var(--gold-soft); border: 1px solid rgba(246, 185, 59, .3); }
.banner svg { width: 22px; height: 22px; flex: none; }

/* band gauge */
.gauge { position: relative; height: 34px; margin: 4px 0 2px; }
.gauge .zone { position: absolute; top: 12px; height: 10px; }
.gauge .mid { position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; background: var(--fg-2); transform: translateX(-50%); }
.gauge .pt { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); border: 3px solid var(--bg); transform: translate(-50%, -50%); box-shadow: 0 0 0 1px var(--gold); }
.gscale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); }
.symchips { display: flex; flex-wrap: wrap; gap: 6px; }
.symchips span { background: var(--surface-3); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.settings > div { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px; min-width: 0; }
.settings .v { font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; font-size: 14px; }
.heat { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
.heat > div { aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; font-size: 10px; color: var(--fg-2); background: var(--surface-3); }

/* buttons, forms */
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 12px; padding: 10px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn svg { width: 18px; height: 18px; }
.btn.ghost { background: var(--surface); color: var(--fg); border-color: var(--line-2); }
.btn.wide { width: 100%; padding: 13px 16px; font-size: 15px; }
.btn:disabled { opacity: .55; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 600; }
.input { width: 100%; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 13px 14px; font-size: 16px; color: var(--fg); }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field { width: 72px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 9px; padding: 6px 8px; font-variant-numeric: tabular-nums; }
select.field { width: auto; }
.err { color: var(--neg); font-size: 14px; }
.okmsg { color: var(--pos); font-size: 14px; }
.steps { display: grid; gap: 12px; counter-reset: st; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; }
.steps li::before { content: counter(st); width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.code { font-family: var(--f-mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px 7px; overflow-wrap: anywhere; display: inline-block; margin-top: 4px; }

/* auth */
.auth { min-height: 100vh; display: grid; align-content: center; gap: 22px; max-width: 420px; margin: 0 auto; padding-block: 40px; }
.auth .mark { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(140deg, #0e5c54, #07182a); display: grid; place-items: center; color: var(--gold); box-shadow: 0 18px 40px -18px rgba(31, 209, 173, .6), inset 0 0 0 1px rgba(255,255,255,.06); }
.auth h1 { font-size: 32px; font-weight: 800; }
.auth form { display: grid; gap: 14px; }
.auth label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.authcard { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: grid; gap: 16px; }

/* menu */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(3, 6, 10, .6); backdrop-filter: blur(2px); }
.menu { position: fixed; z-index: 41; top: calc(env(safe-area-inset-top, 0px) + 64px); right: max(12px, env(safe-area-inset-right, 0px)); width: min(330px, calc(100vw - 24px)); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 18px; padding: 8px; box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .8); }
.menu .who { padding: 10px 12px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu .mi { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; border-radius: 11px; padding: 11px 12px; text-align: left; font-size: 15px; font-weight: 500; }
.menu .mi:hover, .menu .mi:focus-visible { background: var(--surface-3); }
.menu .mi svg { width: 19px; height: 19px; color: var(--accent); flex: none; }
.menu .mi.danger { color: var(--neg); } .menu .mi.danger svg { color: var(--neg); }
.menu form { display: grid; gap: 8px; padding: 6px 12px 12px; }
.menu input { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; width: 100%; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 14px 30px -12px rgba(0,0,0,.7); }
.skel { border-radius: var(--r); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel, .sync.live i { animation: none; } }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; color: var(--line-2); margin-bottom: 8px; }

/* ---------- news module (calendar + predictions) ---------- */
.newsbar { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 14px 0; }
.clockrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-block: 14px 28px; }
.rail > div { min-width: 0; }
@media (min-width: 900px) { .layout { grid-template-columns: 220px minmax(0, 1fr); gap: 26px; } .rail .chips { flex-direction: column; overflow: visible; } }
.rail { display: grid; gap: 14px; align-content: start; min-width: 0; }
main { min-width: 0; display: grid; gap: 14px; align-content: start; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.tab { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.grid2 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat .v { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.1; margin-top: 4px; }
.stat .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.label { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border: 1px solid transparent; white-space: nowrap; }
.label.hot { background: var(--neg-soft); color: var(--neg); border-color: rgba(255, 84, 112, .4); }
.label.cool { background: var(--blue-soft); color: var(--blue); border-color: rgba(78, 164, 255, .4); }
.label.inline { background: var(--surface-3); color: var(--fg); border-color: var(--line-2); }
.label.none { background: transparent; color: var(--muted); border-color: var(--line-2); }
.state { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.state.ahead, .state.live { color: var(--accent); } .state.out { color: var(--muted); }
.scen { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.scen > div { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--bg-2); min-width: 0; }
.scen .big { font-family: var(--f-display); font-weight: 700; font-size: 24px; margin-top: 4px; }
.scen .hot-c { border-color: rgba(255, 84, 112, .45); } .scen .cool-c { border-color: rgba(78, 164, 255, .45); }
@media (max-width: 480px) { .scen { grid-template-columns: 1fr; } }
.wire-row { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); align-items: center; }
.wire-row .when { font-size: 13px; color: var(--muted); }
.wire-row .when b { color: var(--fg); display: block; font-weight: 700; }
.wire-row .what b { font-weight: 700; }
.wire-row .moves { text-align: right; font-size: 13px; }
button.wire-row { background: none; border: 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; border-radius: 0; }
button.wire-row:hover { background: var(--surface-3); }
.side { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; }
.side.buy { background: var(--pos-soft); color: var(--pos); }
.side.sell { background: var(--neg-soft); color: var(--neg); }
.likely { border-radius: 14px; padding: 14px 16px; }
.likely.buy { background: linear-gradient(135deg, #0f6b52, #0b3d3a); color: #eafff7; }
.likely.sell { background: linear-gradient(135deg, #7a2133, #3d0f1a); color: #fff0f3; }
.likely .order { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1.1; margin: 2px 0 6px; }
.prose p + p { margin-top: 8px; }
.toggle { display: inline-flex; align-items: center; gap: 10px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

/* world news */
.story { display: grid; gap: 10px; }
.story img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 13px; background: var(--surface-3); }
.story h3 { font-size: 19px; line-height: 1.3; }
.story .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.story .src { color: var(--accent); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 11px; }
.story p { color: var(--fg-2); }
.story a { font-weight: 700; text-decoration: none; }
</style>
</head>

function mergeDocs(docs) {

      o.pl += +x.pl || 0; o.pct += +x.pct || 0; o.n += +x.n || 0; o.w += +x.w || 0;
    }
    const deals = list.flatMap(v => (v.deals || []).map(d => ({ ...d, sym: d.sym || v.sym, u: d.t - off(v), uo: d.to - off(v) }))).sort((a, b) => b.u - a.u);
    const positions = list.flatMap(v => (v.positions || []).map(p => ({ ...p, sym: p.sym || v.sym, u: p.t - off(v), digits: v.digits })));
    const newsDoc = list.find(v => v.news && v.news.on && v.news.ok) || top;
    out[id] = {

      balance: top.balance, equity: top.equity, margin: top.margin, free: top.free, mlevel: top.mlevel, updated: top.updated,

  else if (t.dataset.f) {
    const ed = S.edits[t.dataset.r] = S.edits[t.dataset.r] || {}, m = ed[t.dataset.k] = ed[t.dataset.k] || {};
    const raw = t.value.trim().replace(",", ".").replace(/[^0-9.\-+]/g, "");
    m[t.dataset.f] = raw === "" ? null : parseFloat(raw);
    store.set("edits", S.edits); render();
  }
});


/* ---------- data refresh ---------- */
async function getJSON(url) { const c = new AbortController(), t = setTimeout(() => c.abort(), 15000); try { const r = await fetch(url, { signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(t); } }
async function refreshFx() {
  const last = DATA.CROSS_ROWS[DATA.CROSS_ROWS.length - 1][0];
  const start = new Date(Date.parse(last) + 86400000).toISOString().slice(0, 10), end = new Date().toISOString().slice(0, 10);
  if (start > end) return;
  const sym = "EUR,GBP,JPY,CHF,CAD,AUD,NZD";
  let j = null;
  for (const u of [`https://api.frankfurter.dev/v1/${start}..${end}?base=USD&symbols=${sym}`, `https://api.frankfurter.app/${start}..${end}?from=USD&to=${sym}`]) { try { j = await getJSON(u); break; } catch (e) {} }
  if (!j || !j.rates) throw new Error("FX source unreachable");
  const rows = Object.keys(j.rates).sort().filter(d => d > last).map(d => { const x = j.rates[d]; return [d, x.EUR, x.GBP, x.JPY, x.CHF, x.CAD, x.AUD, x.NZD]; }).filter(r => r.every(v => v != null));
  S.fx = { rows, fetched: Date.now() }; store.set("fx", S.fx);
}
async function refreshGold() {
  const j = await getJSON("https://xaus.com/api/v1/history");
  const raw = j.points || j.data || j.history || (Array.isArray(j) ? j : []);
  const pts = raw.map(p => [String(p.d || p.date || p.t || "").slice(0, 10), +(p.c ?? p.close ?? p.price ?? p.v)]).filter(p => /^\d{4}-\d\d-\d\d$/.test(p[0]) && p[1] > 0).sort((a, b) => a[0].localeCompare(b[0]));
  if (pts.length < 10) throw new Error("Gold history was empty");
  S.gold = { pts, fetched: Date.now() }; store.set("gold", S.gold);
}
async function refreshSpot() {
  const j = await getJSON("https://xaus.com/api/v1/spot");
  const price = +(j.spot_usd_oz ?? (j.xau && j.xau.price) ?? j.price);
  if (price > 0) { S.spot = { price, t: Date.now() }; store.set("spot", S.spot); }
}
function softRender() { if (A.user && (S.sec === "news" || S.sec === "setup")) render(); }
async function refresh(force) {
  const stale = t => force || Date.now() - (t || 0) > 3 * 3600000;
  S.status = { fx: "· updating…", gold: "· updating…" }; softRender();
  const jobs = [];
  jobs.push(stale(S.fx.fetched) ? refreshFx().then(() => S.status.fx = "· updated").catch(() => S.status.fx = "· offline, using saved data") : Promise.resolve(S.status.fx = ""));
  jobs.push(stale(S.gold.fetched) ? refreshGold().then(() => S.status.gold = "· updated").catch(() => S.status.gold = "· offline, using saved data") : Promise.resolve(S.status.gold = ""));
  jobs.push(refreshSpot().catch(() => {}));
  await Promise.all(jobs);
  CROSSES = allRows(); computeBaseline(); softRender();
}

computeBaseline();
boot();
refresh(false);
setInterval(() => { if (!document.hidden && A.user && S.sec === "news") { renderClock(); if (S.tab !== "series" && !(document.activeElement && document.activeElement.matches("input,select"))) renderNews(); } }, 30000);
setInterval(() => { if (!document.hidden) refreshSpot().then(() => { if (A.user && S.sec === "news") renderClock(); }).catch(() => {}); }, 120000);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (A.user && (["perf", "trades", "stats"].includes(S.sec) || (S.sec === "news" && S.tab === "series"))) render(); }, 200); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
</script>
