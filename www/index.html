<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>EagleTracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: bottom tab bar with four sections; cards in one column on phones, two-up from 900px. Navy desk, teal accent. */
:root {
  color-scheme: dark;
  --bg: #0b0f17; --surface: #121826; --surface-2: #1a2233; --fg: #e6eaf2; --muted: #8a94a8;
  --line: #263042; --brass: #2ec4b6; --brass-ink: #04211e; --gold: #e8c46a;
  --hot: #f46060; --cool: #5fa3c8; --pos: #35c995; --neg: #f46060;
  --f-display: "Space Grotesk", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-sans: "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; text-wrap: pretty; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }

header.top { border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 18px 16px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
header .brand .eyebrow { color: var(--brass); }
header h1 { font-size: 34px; margin-top: 2px; }
header .sub { color: var(--muted); font-size: 13.5px; max-width: 46ch; margin-top: 4px; }
.clockrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; }
.pill b { font-weight: 600; }


.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding-block: 18px 48px; }
.rail > div { min-width: 0; }
@media (min-width: 900px) { .layout { grid-template-columns: 220px minmax(0, 1fr); gap: 28px; } }
.rail { display: grid; gap: 14px; align-content: start; min-width: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
@media (min-width: 900px) { .chips { flex-direction: column; overflow: visible; } }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; text-align: left; white-space: nowrap; flex: none; }
.chip[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; }
.chip small { display: block; font-size: 11.5px; opacity: .75; font-variant-numeric: tabular-nums; }
.chip.gold:not([aria-pressed="true"]) { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }

main { min-width: 0; display: grid; gap: 18px; align-content: start; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; border-radius: 12px; padding: 8px 16px; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }

.card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 16px; min-width: 0; }
.card h3 { font-size: 21px; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.stat .v { font-family: var(--f-display); font-size: 30px; line-height: 1.1; margin-top: 4px; }
.stat .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

.label { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border: 1px solid transparent; white-space: nowrap; }
.label.hot { background: color-mix(in srgb, var(--hot) 20%, transparent); color: var(--hot); border-color: color-mix(in srgb, var(--hot) 45%, transparent); }
.label.cool { background: color-mix(in srgb, var(--cool) 20%, transparent); color: var(--cool); border-color: color-mix(in srgb, var(--cool) 45%, transparent); }
.label.inline { background: var(--surface-2); color: var(--fg); border-color: var(--line); }
.label.none { background: transparent; color: var(--muted); border-color: var(--line); }
.state { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.state.ahead { color: var(--brass); } .state.live { color: var(--brass); } .state.out { color: var(--muted); }

table { border-collapse: collapse; width: 100%; }
.tbl { overflow-x: auto; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
td.r, th.r { text-align: right; }
.up { color: var(--pos); } .down { color: var(--neg); }
.field { width: 70px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-variant-numeric: tabular-nums; }
select.field { width: auto; }

.scen { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.scen > div { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); min-width: 0; }
.scen .big { font-family: var(--f-display); font-size: 26px; margin-top: 4px; }
.scen .hot-c { border-color: color-mix(in srgb, var(--hot) 55%, var(--line)); }
.scen .cool-c { border-color: color-mix(in srgb, var(--cool) 55%, var(--line)); }
@media (max-width: 480px) { .scen { grid-template-columns: 1fr; } }

.wire-row { display: grid; grid-template-columns: 86px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.wire-row .when { font-size: 13px; color: var(--muted); }
.wire-row .when b { color: var(--fg); display: block; font-weight: 600; }
.wire-row .what b { font-weight: 600; }
.wire-row .moves { text-align: right; font-size: 13px; }
button.wire-row { background: none; border: 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; border-radius: 0; }
button.wire-row:hover { background: var(--surface-2); }

.side { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 1px 8px; border-radius: 6px; margin-top: 2px; }
.side.buy { background: var(--brass); color: var(--brass-ink); }
.side.sell { background: var(--neg); color: #1a0d08; }
.likely { border-radius: 12px; padding: 14px 16px; }
.likely.buy { background: var(--brass); color: var(--brass-ink); }
.likely.sell { background: var(--neg); color: #1a0d08; }
.likely .order { font-family: var(--f-display); font-size: 36px; line-height: 1.1; margin: 2px 0 6px; }
.chart svg { width: 100%; height: auto; display: block; }
.prose p + p { margin-top: 8px; }
.note { font-size: 12.5px; color: var(--muted); }
.btn { border: 1px solid var(--brass); background: var(--brass); color: var(--brass-ink); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.toggle { display: inline-flex; align-items: center; gap: 10px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--brass); }

/* ---------- EagleTracker shell ---------- */
[hidden] { display: none !important; }
body { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.appbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.logo { width: 30px; height: 30px; border-radius: 9px; background: var(--brass); color: var(--brass-ink); display: grid; place-items: center; flex: none; }
.appbar .name { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.appbar .sp { flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.live i { background: var(--pos); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pos) 25%, transparent); }
.sync.stale i { background: var(--neg); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.navbtn { background: none; border: 0; padding: 9px 4px 8px; display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.navbtn svg { width: 22px; height: 22px; }
.navbtn[aria-current="page"] { color: var(--brass); }
.sec { display: grid; gap: 16px; padding-block: 16px 28px; }
.sec > * { min-width: 0; }
@media (min-width: 900px) { .sec.two { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } .sec.two .full { grid-column: 1 / -1; } }
.newsbar { display: flex; flex-wrap: wrap; gap: 8px; padding-block: 14px 0; }
.layout { padding-block: 14px 28px; }
.hero { background: linear-gradient(145deg, color-mix(in srgb, var(--brass) 18%, var(--surface)), var(--surface) 60%); border: 1px solid color-mix(in srgb, var(--brass) 30%, var(--line)); border-radius: 18px; padding: 18px; display: grid; gap: 14px; }
.hero .acct { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.hero .big { font-family: var(--f-display); font-weight: 700; font-size: clamp(32px, 9vw, 44px); line-height: 1.05; letter-spacing: -.02em; }
.hero .delta { font-weight: 600; font-size: 15px; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.tile .v { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
.tile .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.ea { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ea:last-child { border-bottom: 0; }
.ea .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--brass); flex: none; font-family: var(--f-display); font-weight: 700; }
.ea .nm { font-weight: 600; overflow-wrap: anywhere; }
.ea .rt { margin-left: auto; text-align: right; white-space: nowrap; }
.barrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.barrow:last-child { border-bottom: 0; }
.barrow .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.barrow .fill { height: 100%; border-radius: 3px; }
.btn.wide { width: 100%; padding: 12px 16px; font-size: 15px; }
.btn:disabled { opacity: .6; }
.auth { min-height: 100%; display: grid; align-content: center; gap: 18px; max-width: 420px; margin: 0 auto; padding-block: 40px; }
.auth h1 { font-size: 34px; font-weight: 700; }
.auth form { display: grid; gap: 12px; }
.auth label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.input { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--fg); }
.err { color: var(--neg); font-size: 14px; }
.okmsg { color: var(--pos); font-size: 14px; }
.linkbtn { background: none; border: 0; color: var(--brass); padding: 0; font-weight: 600; }
.steps { display: grid; gap: 10px; counter-reset: st; padding: 0; margin: 0; list-style: none; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.steps li::before { content: counter(st); width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); color: var(--brass); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.story { display: grid; gap: 10px; }
.story img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: var(--surface-2); }
.story h3 { font-size: 20px; line-height: 1.25; }
.story .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.story .src { color: var(--brass); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 11px; }
.story p { color: color-mix(in srgb, var(--fg) 88%, var(--muted)); }
.story a { color: var(--brass); font-weight: 600; text-decoration: none; }
.skel { border-radius: 14px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.badge.ready { background: color-mix(in srgb, var(--brass) 22%, transparent); color: var(--brass); }
.badge.demo { background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold); }
</style>

<div id="auth" class="wrap" hidden></div>
<div id="app" hidden>
  </head>
<body>
<header class="appbar"><div class="wrap">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/><path d="M15 6h4v4"/></svg></span>
    <span class="name">EagleTracker</span><span class="sp"></span><span class="sync" id="sync"></span>
  </div></header>
  <section id="sec-perf" class="wrap sec two" hidden></section>
  <section id="sec-news" hidden>
    <div class="wrap newsbar clockrow" id="clock"></div>
    <div class="wrap layout">
      <aside class="rail">
        <div><div class="eyebrow" style="margin-bottom:8px">Release</div><div class="chips" id="fams" role="group" aria-label="Release"></div></div>
        <div><div class="eyebrow" style="margin-bottom:8px">Instrument</div><div class="chips" id="pairs" role="group" aria-label="Instrument"></div></div>
      </aside>
      <main>
        <div class="tabs" role="tablist" id="tabs">
          <button class="tab" role="tab" data-tab="wire">Calendar</button>
          <button class="tab" role="tab" data-tab="brief">Prediction</button>
          <button class="tab" role="tab" data-tab="series">Charts</button>
        </div>
        <section id="view"></section>
      </main>
    </div>
  </section>
  <section id="sec-world" class="wrap sec" hidden></section>
  <section id="sec-account" class="wrap sec two" hidden></section>
  <nav class="nav" aria-label="Sections"><div class="in">
    <button class="navbtn" data-sec="perf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Performance</button>
    <button class="navbtn" data-sec="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>News</button>
    <button class="navbtn" data-sec="world"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.500 0 18M12 3c-3 3.5-3 14.500 0 18"/></svg>World</button>
    <button class="navbtn" data-sec="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.500-4 5-6 8-6s6.500 2 8 6"/></svg>Account</button>
  </div></nav>

<script>
const DATA = {"FAMILIES":[{"id":"cpi","short":"CPI","name":"Consumer Price Index","issuer":"Bureau of Labor Statistics","href":"https://www.bls.gov/cpi/","clock":"08:30 ET","trades":"Core month-on-month. Headline only when energy does the whole move.","why":"The inflation print the rates market marks first. A hotter core keeps the funds path higher and is dollar-supportive while the Fed is still leaning toward another hike.","hawkish":"Core or headline above the consensus monthly change."},{"id":"nfp","short":"NFP","name":"Employment Situation","issuer":"Bureau of Labor Statistics","href":"https://www.bls.gov/news.release/empsit.toc.htm","clock":"08:30 ET","trades":"Payrolls, unemployment rate, and average hourly earnings together. One line rarely settles it.","why":"The labor half of the Fed's mandate. Strong hiring and firm wages support the dollar; a miss that reopens a pause does the opposite.","hawkish":"Payrolls or earnings above consensus, or a lower unemployment rate."},{"id":"fomc","short":"FOMC","name":"FOMC rate decision","issuer":"Federal Reserve Board","href":"https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm","clock":"14:00 ET","trades":"The decision, the vote, and — on projection meetings — the dots. The press conference can reverse the first move.","why":"This is the dollar's policy rate. The reaction is measured on the next ECB session because 14:00 ET is after the European fix.","hawkish":"A hike, a hold that the market had priced as a cut, or dots that lift the path."},{"id":"ppi","short":"PPI","name":"Producer Price Index","issuer":"Bureau of Labor Statistics","href":"https://www.bls.gov/ppi/","clock":"08:30 ET","trades":"Final demand, and the trade-services and core lines when they diverge from the headline.","why":"Pipeline prices into CPI. It moves the dollar when it changes the inflation path, not when it merely echoes a CPI print from the same week.","hawkish":"Final demand or core PPI above consensus."},{"id":"pce","short":"PCE","name":"PCE and GDP","issuer":"Bureau of Economic Analysis","href":"https://www.bea.gov/data/personal-consumption-expenditures-price-index","clock":"08:30 ET","trades":"Core PCE month-on-month, the Fed's preferred inflation gauge. GDP prints in the same window on some dates and cannot be separated on a daily FX bar.","why":"What the Committee actually targets. A hot core PCE into a live meeting is a dollar event even if CPI already told the story.","hawkish":"Core PCE above consensus, or a growth revision that keeps the hike case alive."},{"id":"retail","short":"Retail","name":"Advance retail sales","issuer":"US Census Bureau","href":"https://www.census.gov/retail/sales.html","clock":"08:30 ET","trades":"Control group, not the headline, when autos or gasoline dominate.","why":"The cleanest monthly read on goods demand. Strong control-group sales support growth and, in this regime, the dollar.","hawkish":"Control group above consensus."},{"id":"ism-mfg","short":"ISM mfg","name":"ISM manufacturing PMI","issuer":"Institute for Supply Management","href":"https://www.ismworld.org/supply-management-news-and-reports/reports/ism-report-on-business/","clock":"10:00 ET","trades":"Headline versus 50, then new orders and prices paid.","why":"First broad activity print of the month. Prices-paid is the inflation tell inside the survey.","hawkish":"Headline or prices-paid above consensus."},{"id":"ism-svc","short":"ISM svc","name":"ISM services PMI","issuer":"Institute for Supply Management","href":"https://www.ismworld.org/supply-management-news-and-reports/reports/ism-report-on-business/","clock":"10:00 ET","trades":"Headline, new orders, and prices. Services is the larger share of the US economy.","why":"A services miss hits the soft-landing story. A hot prices index revives the inflation story. The dollar follows whichever one the market is already afraid of.","hawkish":"Headline or prices above consensus."},{"id":"jolts","short":"JOLTS","name":"Job openings","issuer":"Bure function plain(html) { const d = new DOMParser().parseFromString("<div>" + (html || "") + "</div>", "text/html"); d.querySelectorAll("script,style").forEach(n => n.remove()); return (d.body.textContent || "").replace(/\s+/g, " ").trim(); }

async function refreshFx() {
  const last = DATA.CROSS_ROWS[DATA.CROSS_ROWS.length - 1][0];
  const start = new Date(Date.parse(last) + 86400000).toISOString().slice(0, 10), end = new Date().toISOString().slice(0, 10);
  if (start > end) return;
  const sym = "EUR,GBP,JPY,CHF,CAD,AUD,NZD";
  let j = null;
  for (const u of [`https://api.frankfurter.dev/v1/${start}..${end}?base=USD&symbols=${sym}`, `https://api.frankfurter.app/${start}..${end}?from=USD&to=${sym}`]) { try { j = await getJSON(u); break; } catch (e) {} }
  if (!j || !j.rates) throw new Error("FX source unreachable");
  const rows = Object.keys(j.rates).sort().filter(d => d > last).map(d => { const x = j.rates[d]; return [d, x.EUR, x.GBP, x.JPY, x.CHF, x.CAD, x.AUD, x.NZD]; }).filter(r => r.every(v => v != null));
  S.fx = { rows, fetched: Date.now() }; store.set("fx", S.fx);
}
async function refreshGold() {
  const j = await getJSON("https://xaus.com/api/v1/history");
  const raw = j.points || j.data || j.history || (Array.isArray(j) ? j : []);
  const pts = raw.map(p => [String(p.d || p.date || p.t || "").slice(0, 10), +(p.c ?? p.close ?? p.price ?? p.v)]).filter(p => /^\d{4}-\d\d-\d\d$/.test(p[0]) && p[1] > 0).sort((a, b) => a[0].localeCompare(b[0]));
  if (pts.length < 10) throw new Error("Gold history was empty");
  S.gold = { pts, fetched: Date.now() }; store.set("gold", S.gold);
}
async function refreshSpot() {
  const j = await getJSON("https://xaus.com/api/v1/spot");
  const price = +(j.spot_usd_oz ?? (j.xau && j.xau.price) ?? j.price);
  if (price > 0) { S.spot = { price, t: Date.now() }; store.set("spot", S.spot); }
}
function softRender() { if (A.user && (S.sec === "news" || S.sec === "account")) render(); }
async function refresh(force) {
  const stale = t => force || Date.now() - (t || 0) > 3 * 3600000;
  S.status = { fx: "· updating…", gold: "· updating…" }; softRender();
  const jobs = [];
  jobs.push(stale(S.fx.fetched) ? refreshFx().then(() => S.status.fx = "· updated").catch(() => S.status.fx = "· offline, using saved data") : Promise.resolve(S.status.fx = ""));
  jobs.push(stale(S.gold.fetched) ? refreshGold().then(() => S.status.gold = "· updated").catch(() => S.status.gold = "· offline, using saved data") : Promise.resolve(S.status.gold = ""));
  jobs.push(refreshSpot().catch(() => {}));
  await Promise.all(jobs);
  CROSSES = allRows(); computeBaseline(); softRender();
}

computeBaseline();
boot();
refresh(false);
setInterval(() => { if (!document.hidden && A.user && S.sec === "news") { renderClock(); if (S.tab !== "series" && !(document.activeElement && document.activeElement.matches("input,select"))) renderNews(); } }, 30000);
setInterval(() => { if (!document.hidden) refreshSpot().then(() => { if (A.user && S.sec === "news") renderClock(); }).catch(() => {}); }, 120000);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (A.user && (S.sec === "perf" || (S.sec === "news" && S.tab === "series"))) render(); }, 200); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
</script>
