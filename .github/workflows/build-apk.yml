name: Build EaglePro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: |
          npm install
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/

      - name: Create the Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#3b3390' --splashBackgroundColor '#090c16' || echo "Icon step skipped"

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EaglePro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EaglePro-APK
          path: EaglePro.apk
